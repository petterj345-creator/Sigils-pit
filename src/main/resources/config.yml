# =========================================
# AbyssSigils — global config
# =========================================

# Set true to log GUI clicks + other diagnostics to console.
debug: false

# =========================================
# Party entry (MMOCore)
# =========================================
# When MMOCore is installed, the player who opens an Abyss map enters right away
# and their party members standing nearby get an invite to join via /abyss accept.
party:
  # How close (blocks) a party member must be to the opener to get an invite.
  invite-radius: 16
  # How long (seconds) an invite stays valid.
  invite-seconds: 20

# =========================================
# Map tiers & quality (PoE-style)
# =========================================
# Maps carry a TIER (combat difficulty) and a QUALITY (reward bonus), raised by
# catalyst currencies. Tune the scaling here or in-game: /abyss admin -> Map Scaling.
scaling:
  tier:
    # Highest tier a map can reach.
    max: 16
    # Per tier, mobs get this much more max health and (a little) attack damage.
    # Damage is deliberately low — most of our mobs are already strong via skills.
    hp-percent-per-tier: 15
    damage-percent-per-tier: 3
    # Per tier, mob drop chances (sigils/maps/currency) are boosted by this %.
    # This only multiplies drops you've ALREADY configured on mobs — tier makes
    # them more frequent, it doesn't add drops on its own.
    drop-chance-percent-per-tier: 8
    # Maps that drop inside a tiered run come pre-tiered at (run tier - this),
    # so high-tier runs sustain high-tier maps. 1 = a T10 run drops T9 maps.
    map-drop-tier-offset: 1
    # Risk/reward: clearing a tougher (higher tier) map also pays more XP and
    # money. Stacks on top of quality's reward bonus.
    reward-xp-percent-per-tier: 5
    reward-money-percent-per-tier: 5
  quality:
    # Highest quality a map can reach.
    max: 20
    # Per quality, end rewards scale by this much more XP / money.
    xp-percent: 10
    money-percent: 10
    # Every N quality grants one extra possible loot item from the pool.
    quality-per-extra-item: 3

# =========================================
# The Sundering (Expedition-style event)
# =========================================
# A buried hoard manifests on a map carrying the Sundering Catalyst (or via the
# Abyssal Omen skill on a blank map). Players plant a limited supply of Seismic
# Charges; any buried pack or Remnant inside a charge's blast is dragged up on
# detonation, and the unearthed mobs drop Shards spent at a vendor afterward.
#
# Most tuning is now PER-TEMPLATE — edit it in-game under Events → The Sundering
# (charges, blast/chain/field radius, buried packs, Remnants, mobs per pack,
# Shards per kill, vendor wares, max alive) plus its own loot pool. Only the
# Shard-vendor price band stays global here.
sundering:
  # Shard price band for vendor wares (rarer items — lower drop chance% — cost
  # nearer the max).
  vendor-price-min: 8
  vendor-price-max: 40
  # Shards to reroll ("haggle") the vendor's stock. 0 disables the reroll button.
  vendor-reroll-cost: 12

# =========================================
# Tome of Mastery — endgame skill book
# =========================================
# Players earn 1 skill point the first time they complete each map, and spend
# them on the skill tree (right-click the book). The book never drops on death.
skillbook:
  # Give every player a Tome of Mastery on join (and restore it after death)?
  give-on-join: true

# =========================================
# Tutorial NPC (Citizens)  —  /trait sigils
# =========================================
# Add the trait to any Citizens NPC with:   /npc select   then   /trait sigils
# Players RIGHT-CLICK the NPC to open this guide and click the [Next]/[Back]/
# [Topics] buttons (or left-click the NPC) to page through it.
#
# Everything here is plain text with &-colour codes. Add, remove, or reorder
# pages freely — each page is a "title" plus a list of "lines". No rebuild
# needed; edit and run /abyss reload.
tutorial:
  # Header shown above every page. {npc} = the NPC's name, {n}/{total} = paging.
  title: "&5&l✦ {npc} &8— &5&lEndgame Codex &7({n}/{total})"
  # Footer hint shown under the navigation buttons.
  footer: "&8Right-click me for the next page, or use the buttons above."
  pages:
    - title: "Welcome, Delver"
      lines:
        - "&7So you want to master &5the Abyss&7? Good."
        - "&7The endgame is a loop: &fclear maps&7, collect &fsigils"
        - "&7and &fcurrency&7, &fupgrade your power&7, then dive &odeeper&7."
        - ""
        - "&7Click &a[Topics]&7 below to jump to any subject, or just"
        - "&7keep right-clicking me to read it all in order."
    - title: "The Book of Sigils"
      lines:
        - "&7Your &5Book of Sigils &7is your power core. Right-click"
        - "&7it (or use &f/sigils&7) to open your socket menu."
        - ""
        - "&7It has two kinds of sockets:"
        - "&8• &fSmall &7— hold &aMINOR &7sigils (your workhorses)."
        - "&8• &fBig &7— hold &bMAJOR &7& &dGRAND &7sigils (the big stats)."
        - ""
        - "&7Drag a sigil into a matching socket and its stats apply"
        - "&7instantly. More sockets unlock as you upgrade the book."
    - title: "Sigils & Stats"
      lines:
        - "&7Sigils drop from mobs in the Abyss. Each has a &frank&7:"
        - "&8• &aMINOR &7— common, everyday stats."
        - "&8• &bMAJOR &7— the powerful stats: big damage %,"
        - "  &7lifesteal, crit, and MMOItems stats."
        - "&8• &dGRAND &7— the rarest, slotted only in late-tier books."
        - ""
        - "&7Stats cover &fCombat &7(damage, defense, crit, HP,"
        - "&7lifesteal, thorns) and &fGathering &7(bonus ore/wood/crops)."
    - title: "Dust & The Forge"
      lines:
        - "&7Clearing a map earns you a few &fforge attempts&7."
        - "&7At the &6Forge of the Abyss &7you can:"
        - "&8• &7Upgrade a &fsigil&7 — raises its tier, may roll a"
        - "  &7bonus sub-stat. Rarer ranks succeed less often."
        - "&8• &7Upgrade your &5Book&7 — drop the book in the forge"
        - "  &7slot and click FORGE to open more sockets."
        - ""
        - "&7Higher ranks are a gamble — a &dGRAND &7is never certain."
    - title: "Entering The Abyss"
      lines:
        - "&7Find the &5portal &7and right-click it. &fSneak &7first to"
        - "&7pull nearby players in as a &fparty&7."
        - ""
        - "&7Maps run in one of two modes:"
        - "&8• &fMAP &7— trash flows endlessly; the &cboss &7appears"
        - "  &7once you've killed enough."
        - "&8• &fWAVES &7— clear discrete waves; boss after the last."
        - ""
        - "&7Kill the boss → a &6reward chest &7& &6forge altar &7spawn."
        - "&7Use &f/abyss leave &7to exit; the instance is wiped."
    - title: "Maps, Tier & Quality"
      lines:
        - "&7Every map carries two numbers:"
        - "&8• &cTier &7— combat difficulty: tougher mobs, more"
        - "  &7frequent drops, &cand &7bigger XP/money payouts."
        - "&8• &bQuality &7— reward bonus: more loot, XP and money."
        - ""
        - "&7You raise them with &dAbyssal currency &7items. Hold a"
        - "&7currency on your cursor and click a map to roll a"
        - "&7modifier onto it — Path-of-Exile style crafting."
        - "&7Higher-tier runs even drop higher-tier maps to sustain you."
    - title: "In-Map Events"
      lines:
        - "&7Maps can contain special &fevents &7— optional, high-risk,"
        - "&7high-reward encounters you choose to trigger:"
        - ""
        - "&8• &3Maelstrom &7— a rift you tear open."
        - "&8• &6Reliquary &7— a sealed strongbox to crack."
        - "&8• &5Altar of Souls &7— a ritual that feeds a soul shop."
        - "&8• &cThe Sundering &7— blast open a buried hoard."
        - ""
        - "&7And with the &fAbyssal Omen &7skill, even a blank map can"
        - "&7manifest one of these on its own. Read on for each."
    - title: "Event: Maelstrom"
      lines:
        - "&3The Maelstrom &7is a breach-style rift."
        - ""
        - "&7Right-click it to &ftear it open&7. Mobs pour out in"
        - "&7pulses — survive and keep killing to fill its meter."
        - "&7Clear it for a dedicated &floot cache&7."
        - ""
        - "&7Skills &bRift Surge &7(spawn faster) and &cCataclysm"
        - "&7(more mobs per pulse) make your rifts wilder — and richer."
    - title: "Event: Reliquary"
      lines:
        - "&6The Reliquary &7is a sealed strongbox."
        - ""
        - "&7Unseal it, then defeat the &fguardians &7that awaken to"
        - "&7protect it. Clear them all and it cracks open into loot."
        - ""
        - "&7The &6Relic Hunter &7skill makes every Reliquary you"
        - "&7crack yield more items."
    - title: "Event: Altar of Souls"
      lines:
        - "&5The Altar of Souls &7runs a ritual."
        - ""
        - "&7Mobs you kill during the ritual yield &fsouls&7. Spend"
        - "&7them at the &fSoul Shop &7for rewards — and you can"
        - "&freserve &7(lay away) an item to claim across future maps."
        - ""
        - "&7The &5Soul Harvest &7skill boosts souls per kill."
    - title: "Event: The Sundering"
      lines:
        - "&cThe Sundering &7buries a hoard in the dungeon."
        - ""
        - "&7You're handed &cSeismic Charges&7. Plant them on the"
        - "&7ground near the dig site — each must be within reach"
        - "&7of the &cDetonator &7or another charge, so chain them."
        - ""
        - "&7Strike the Detonator: every buried pack &oand &7Remnant"
        - "&7in a charge's blast is dragged up. &fRemnants &7buff the"
        - "&7mobs but pay out far more &6Shards&7 and richer wares."
        - ""
        - "&7Slay it all and a &edealer &7sets up in the crater —"
        - "&7spend your &6Shards &7on the items it has dug up."
        - ""
        - "&7Skills &cExcavator &7(more charges) and &cProspector"
        - "&7(more Shards) make every Sundering bigger."
    - title: "The Tome of Mastery"
      lines:
        - "&7Your &fTome of Mastery &7is a permanent skill tree."
        - "&7Right-click it to open it. It never drops on death."
        - ""
        - "&7You earn &f1 skill point &7the FIRST time you complete"
        - "&7each map. Spend points on nodes like:"
        - "&8• &fGreater Spoils &7— more loot items per roll."
        - "&8• &fScholar &7/ &fTreasure Hunter &7— more XP / money."
        - "&8• &fAbyssal Omen &7— blank maps can spawn an event."
        - "&8• &7…plus a branch for each event type."
    - title: "The Endgame Loop"
      lines:
        - "&7Put it together:"
        - ""
        - "&f1. &7Dive the Abyss, kill mobs, grab sigils & currency."
        - "&f2. &7Socket sigils; forge the best ones higher."
        - "&f3. &7Use currency to push map &ctier &7& &bquality&7."
        - "&f4. &7Run events for big caches; bank skill points."
        - "&f5. &7Spend mastery points, then dive &odeeper&7."
        - ""
        - "&7That's the whole game. Now go earn it, Delver. &5✦"

socket:
  # Legacy slot counts — only used if a player has no Book of Sigils item
  # in their inventory (e.g. very old saves). Modern behaviour: slots come
  # from the BOOK ITEM's tier, looked up below.
  small-slots: 10
  big-slots: 3
  grand-slots: 0
  gui-title: "&5&lBook of Sigils"
  # Give a Book of Sigils (T1) to new players on first join?
  give-book-on-join: true

# =========================================
# Book of Sigils — tier-based progression
# =========================================
# Books drop with tier 1 by default and can be upgraded at the Forge of the
# Abyss (drop the book into the same slot you'd put a sigil and click FORGE).
#
# Each tier opens a specific number of sockets. The book in the player's
# MAIN HAND when they open the socket menu decides how many slots show.
# (We pick main hand → off hand → first matching in inventory.)
#
# Tiers map by index: index 0 = T1, index 1 = T2, etc.
# If the list is shorter than book.max-tier, the last entry is reused.
book:
  # Maximum tier a book can reach in the Forge.
  max-tier: 20

  # Per-tier socket layout. small = minor sigils, big = major, grand = grand.
  # Defaults: 1 small at T1; +1 small per tier up to T5; majors unlock at T6;
  # grand slots unlock at T16. Edit freely to taste.
  tiers:
    - { small: 1,  big: 0, grand: 0 }   # T1
    - { small: 2,  big: 0, grand: 0 }   # T2
    - { small: 3,  big: 0, grand: 0 }   # T3
    - { small: 4,  big: 0, grand: 0 }   # T4
    - { small: 5,  big: 0, grand: 0 }   # T5
    - { small: 5,  big: 1, grand: 0 }   # T6
    - { small: 6,  big: 1, grand: 0 }   # T7
    - { small: 6,  big: 1, grand: 0 }   # T8
    - { small: 7,  big: 1, grand: 0 }   # T9
    - { small: 7,  big: 2, grand: 0 }   # T10
    - { small: 8,  big: 2, grand: 0 }   # T11
    - { small: 8,  big: 2, grand: 0 }   # T12
    - { small: 9,  big: 2, grand: 0 }   # T13
    - { small: 9,  big: 3, grand: 0 }   # T14
    - { small: 10, big: 3, grand: 0 }   # T15
    - { small: 10, big: 3, grand: 1 }   # T16
    - { small: 10, big: 3, grand: 1 }   # T17
    - { small: 10, big: 3, grand: 2 }   # T18
    - { small: 10, big: 3, grand: 2 }   # T19
    - { small: 10, big: 3, grand: 3 }   # T20

  # Success % when forging T(N) → T(N+1), per book tier (books still use a
  # per-tier curve; sigils use upgrade.success-chance-per-rank instead).
  # Index 0 = T1→T2, ..., index 18 = T19→T20.
  # Books are a huge power spike, so success is low and falls off toward T20.
  success-chance-per-tier:
    - 10   # T1  -> T2
    - 10   # T2  -> T3
    - 10   # T3  -> T4
    - 10   # T4  -> T5
    - 9    # T5  -> T6
    - 9    # T6  -> T7
    - 8    # T7  -> T8
    - 8    # T8  -> T9
    - 7    # T9  -> T10
    - 7    # T10 -> T11
    - 6    # T11 -> T12
    - 6    # T12 -> T13
    - 6    # T13 -> T14
    - 5    # T14 -> T15
    - 5    # T15 -> T16
    - 5    # T16 -> T17
    - 5    # T17 -> T18
    - 5    # T18 -> T19
    - 5    # T19 -> T20

dungeon:
  # Where players return to when they leave a dungeon.
  # By DEFAULT the exit lands on top of the portal block — "you come out
  # where you went in". To override that and use the custom x/y/z below,
  # set use-custom to true.
  exit:
    use-custom: false
    world: "world"
    x: 0.5
    y: 70.0
    z: 0.5

portal:
  block-type: "END_PORTAL_FRAME"
  world: "world"
  x: 100
  y: 70
  z: 100

upgrade-block:
  block-type: "LODESTONE"

return-portal:
  # Block that spawns near the upgrade altar when the boss is killed.
  # Players right-click it to return to the overworld portal location.
  block-type: "END_GATEWAY"

upgrade:
  # XP levels charged per upgrade attempt. 0 = no XP required (default).
  xp-level-cost: 0
  # If xp-level-cost > 0, charge it even on failed attempts?
  consume-xp-on-fail: true
  # Chance (0.0–1.0) of rolling a bonus sub-stat on a successful upgrade.
  substat-chance: 0.25
  # Cap on upgrade tier (per-definition maxTier still applies if lower).
  max-tier: 5
  # How many forge attempts each player gets after clearing one dungeon.
  # Each click on the FORGE button counts as one attempt, whether it
  # succeeds or fails. Set to -1 for unlimited (the legacy behaviour).
  attempts-per-clear: 3
  # Forge success %, keyed by the sigil's RANK. Better ranks are rarer, so
  # they should upgrade less often — a GRAND sigil is never a sure thing.
  # Edit these in-game: /abyss admin -> Forge Chances.
  # Any rank you omit falls back to the built-in default (90/60/30).
  success-chance-per-rank:
    MINOR: 90
    MAJOR: 60
    GRAND: 30
