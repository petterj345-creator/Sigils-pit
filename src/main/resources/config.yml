# =========================================
# AbyssSigils — global config
# =========================================

# Set true to log GUI clicks + other diagnostics to console.
debug: false

# =========================================
# Party entry (MMOCore)
# =========================================
# When MMOCore is installed, the player who opens an Abyss map enters right away
# and their party members standing nearby get an invite to join via /abyss accept.
party:
  # How close (blocks) a party member must be to the opener to get an invite.
  invite-radius: 16
  # How long (seconds) an invite stays valid.
  invite-seconds: 20

# =========================================
# Map tiers & quality (PoE-style)
# =========================================
# Maps carry a TIER (combat difficulty) and a QUALITY (reward bonus), raised by
# catalyst currencies. Tune the scaling here or in-game: /abyss admin -> Map Scaling.
scaling:
  tier:
    # Highest tier a map can reach.
    max: 16
    # Per tier, mobs get this much more max health and (a little) attack damage.
    # Damage is deliberately low — most of our mobs are already strong via skills.
    hp-percent-per-tier: 15
    damage-percent-per-tier: 3
    # Per tier, mob drop chances (sigils/maps/currency) are boosted by this %.
    # This only multiplies drops you've ALREADY configured on mobs — tier makes
    # them more frequent, it doesn't add drops on its own.
    drop-chance-percent-per-tier: 8
    # Maps that drop inside a tiered run come pre-tiered at (run tier - this),
    # so high-tier runs sustain high-tier maps. 1 = a T10 run drops T9 maps.
    map-drop-tier-offset: 1
    # Risk/reward: a tougher map does NOT pay more XP/money (that's quality's
    # job). Instead, every map's end Reward Chest gives more and rarer loot per
    # tier:
    #   - loot-items-per-tier: extra loot items the end chest can roll.
    #   - loot-rarity-boost-per-tier: % of each entry's gap to 100% chance that's
    #     closed, so rarer (low-chance) loot surfaces far more at high tier.
    #     Capped at 100% total (every eligible entry appears).
    loot-items-per-tier: 1
    loot-rarity-boost-per-tier: 4
  quality:
    # Highest quality a map can reach.
    max: 20
    # Per quality, end rewards scale by this much more XP / money.
    xp-percent: 10
    money-percent: 10
    # Every N quality grants one extra possible loot item from the pool.
    quality-per-extra-item: 3

# =========================================
# Tome of Mastery — endgame skill book
# =========================================
# Players earn 1 skill point the first time they complete each map, and spend
# them on the skill tree (right-click the book). The book never drops on death.
skillbook:
  # Give every player a Tome of Mastery on join (and restore it after death)?
  give-on-join: true

socket:
  # Legacy slot counts — only used if a player has no Book of Sigils item
  # in their inventory (e.g. very old saves). Modern behaviour: slots come
  # from the BOOK ITEM's tier, looked up below.
  small-slots: 10
  big-slots: 3
  grand-slots: 0
  gui-title: "&5&lBook of Sigils"
  # Give a Book of Sigils (T1) to new players on first join?
  give-book-on-join: true

# =========================================
# Book of Sigils — tier-based progression
# =========================================
# Books drop with tier 1 by default and can be upgraded at the Forge of the
# Abyss (drop the book into the same slot you'd put a sigil and click FORGE).
#
# Each tier opens a specific number of sockets. The book in the player's
# MAIN HAND when they open the socket menu decides how many slots show.
# (We pick main hand → off hand → first matching in inventory.)
#
# Tiers map by index: index 0 = T1, index 1 = T2, etc.
# If the list is shorter than book.max-tier, the last entry is reused.
book:
  # Maximum tier a book can reach in the Forge.
  max-tier: 20

  # Per-tier socket layout. small = minor sigils, big = major, grand = grand.
  # Defaults: 1 small at T1; +1 small per tier up to T5; majors unlock at T6;
  # grand slots unlock at T16. Edit freely to taste.
  tiers:
    - { small: 1,  big: 0, grand: 0 }   # T1
    - { small: 2,  big: 0, grand: 0 }   # T2
    - { small: 3,  big: 0, grand: 0 }   # T3
    - { small: 4,  big: 0, grand: 0 }   # T4
    - { small: 5,  big: 0, grand: 0 }   # T5
    - { small: 5,  big: 1, grand: 0 }   # T6
    - { small: 6,  big: 1, grand: 0 }   # T7
    - { small: 6,  big: 1, grand: 0 }   # T8
    - { small: 7,  big: 1, grand: 0 }   # T9
    - { small: 7,  big: 2, grand: 0 }   # T10
    - { small: 8,  big: 2, grand: 0 }   # T11
    - { small: 8,  big: 2, grand: 0 }   # T12
    - { small: 9,  big: 2, grand: 0 }   # T13
    - { small: 9,  big: 3, grand: 0 }   # T14
    - { small: 10, big: 3, grand: 0 }   # T15
    - { small: 10, big: 3, grand: 1 }   # T16
    - { small: 10, big: 3, grand: 1 }   # T17
    - { small: 10, big: 3, grand: 2 }   # T18
    - { small: 10, big: 3, grand: 2 }   # T19
    - { small: 10, big: 3, grand: 3 }   # T20

  # Success % when forging T(N) → T(N+1), per book tier (books still use a
  # per-tier curve; sigils use upgrade.success-chance-per-rank instead).
  # Index 0 = T1→T2, ..., index 18 = T19→T20.
  # Books are a huge power spike, so success is low and falls off toward T20.
  success-chance-per-tier:
    - 10   # T1  -> T2
    - 10   # T2  -> T3
    - 10   # T3  -> T4
    - 10   # T4  -> T5
    - 9    # T5  -> T6
    - 9    # T6  -> T7
    - 8    # T7  -> T8
    - 8    # T8  -> T9
    - 7    # T9  -> T10
    - 7    # T10 -> T11
    - 6    # T11 -> T12
    - 6    # T12 -> T13
    - 6    # T13 -> T14
    - 5    # T14 -> T15
    - 5    # T15 -> T16
    - 5    # T16 -> T17
    - 5    # T17 -> T18
    - 5    # T18 -> T19
    - 5    # T19 -> T20

dungeon:
  # Where players return to when they leave a dungeon.
  # By DEFAULT the exit lands on top of the portal block — "you come out
  # where you went in". To override that and use the custom x/y/z below,
  # set use-custom to true.
  exit:
    use-custom: false
    world: "world"
    x: 0.5
    y: 70.0
    z: 0.5

portal:
  block-type: "END_PORTAL_FRAME"
  world: "world"
  x: 100
  y: 70
  z: 100

upgrade-block:
  block-type: "LODESTONE"

return-portal:
  # Block that spawns near the upgrade altar when the boss is killed.
  # Players right-click it to return to the overworld portal location.
  block-type: "END_GATEWAY"

upgrade:
  # XP levels charged per upgrade attempt. 0 = no XP required (default).
  xp-level-cost: 0
  # If xp-level-cost > 0, charge it even on failed attempts?
  consume-xp-on-fail: true
  # Chance (0.0–1.0) of rolling a bonus sub-stat on a successful upgrade.
  substat-chance: 0.25
  # Cap on upgrade tier (per-definition maxTier still applies if lower).
  max-tier: 5
  # How many forge attempts each player gets after clearing one dungeon.
  # Each click on the FORGE button counts as one attempt, whether it
  # succeeds or fails. Set to -1 for unlimited (the legacy behaviour).
  attempts-per-clear: 3
  # Forge success %, keyed by the sigil's RANK. Better ranks are rarer, so
  # they should upgrade less often — a GRAND sigil is never a sure thing.
  # Edit these in-game: /abyss admin -> Forge Chances.
  # Any rank you omit falls back to the built-in default (90/60/30).
  success-chance-per-rank:
    MINOR: 90
    MAJOR: 60
    GRAND: 30
