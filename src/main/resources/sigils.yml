# =========================================
# Sigil definitions
# =========================================
#
# Each sigil has:
#   display:        shown name (& color codes)
#   material:       icon material
#   model-data:     optional custom model data int
#   rank:           MINOR (small socket), MAJOR (big socket), GRAND (grand socket)
#   stat:           main stat granted (see list below)
#   tier-values:    value at each tier; length = max tier
#   substat-pool:   stats that can roll as sub-stats on upgrade
#
# Stat rules:
#   - MINOR sigils can only have stats whose rankFloor is MINOR.
#   - MAJOR sigils can have MINOR-floor or MAJOR-floor stats.
#   - GRAND sigils can have anything, including GRAND_* stats.
#
# Supported stats (rankFloor in parens):
#   COMBAT (MINOR):  DAMAGE_PERCENT, DEFENSE_PERCENT, MAX_HEALTH, SPEED_PERCENT, CRIT_CHANCE
#   COMBAT (MAJOR):  DAMAGE_PERCENT_BIG, LIFESTEAL_PERCENT, THORNS_PERCENT, EXTRA_CRIT_DAMAGE
#   COMBAT (GRAND):  GRAND_OMNIDAMAGE, GRAND_FORTRESS, GRAND_VITALITY, GRAND_SOULSTEAL, GRAND_GODSPEED
#   GATHERING (MINOR): WOOD_MULTIPLIER, ORE_MULTIPLIER, CROP_MULTIPLIER
#   GATHERING (MAJOR): LUCKY_FIND, FORTUNE_AURA
#   MMOITEMS (MINOR):  MMO_HEALTH_REGEN, MMO_ARMOR, MMO_BLOCK_RATING, MMO_DODGE_RATING
#   MMOITEMS (MAJOR):  MMO_ATTACK_DAMAGE, MMO_MAGIC_DAMAGE, MMO_MAGICAL_DAMAGE,
#                      MMO_CRITICAL_STRIKE_CHANCE, MMO_CRITICAL_STRIKE_POWER,
#                      MMO_PVE_DAMAGE, MMO_PVP_DAMAGE,
#                      MMO_MAGIC_RESISTANCE, MMO_ARMOR_PIERCING, MMO_BLOCK_POWER,
#                      MMO_COOLDOWN_REDUCTION, MMO_MAX_MANA, MMO_MANA_REGEN

